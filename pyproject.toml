[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-backtester"
version = "0.1.0"
description = "A beginner-friendly event-driven trading backtesting platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "yfinance>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
